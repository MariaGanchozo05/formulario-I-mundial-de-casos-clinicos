<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Resultados — I Mundial de Casos Clínicos HPVC 2026</title>
<link rel="icon" href="escudo-msp.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #123b5d;
  --primary-light: #1f6f8f;
  --accent: #0b7a75;
  --accent-light: #e6f4f3;
  --accent2: #7c3aed;
  --accent2-light: #ede9fe;
  --bg: #f4f7f9;
  --surface: #ffffff;
  --border: #d5e0e6;
  --border-focus: #1f6f8f;
  --text: #26343c;
  --text-muted: #64748b;
  --danger: #b42318;
  --success: #16794c;
  --success-bg: #eaf7f0;
  --gold: #b7791f;
  --silver: #64748b;
  --bronze: #92400e;
  --shadow-sm: 0 2px 8px rgba(18,59,93,0.06);
  --shadow-md: 0 8px 28px rgba(18,59,93,0.10);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

.icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

body { background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }

/* ══ HEADER ══ */
header {
  background: linear-gradient(135deg, rgba(18,59,93,0.95), rgba(31,111,143,0.92)), url('BACKGROUND.jpg') center/cover no-repeat;
  color: #fff; padding: 26px 20px 20px; text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.header-brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px; }
.header-brand img { width: 52px; height: 52px; border-radius: 50%; background: #fff; padding: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
header h1 { font-size: clamp(17px, 3vw, 26px); font-weight: 800; letter-spacing: -0.4px; }
header h2 { font-size: clamp(12px, 1.8vw, 15px); font-weight: 500; opacity: 0.9; margin-top: 2px; }
.public-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.18); backdrop-filter: blur(4px);
  border-radius: 20px; padding: 4px 14px; font-size: 12.5px; font-weight: 700;
  margin-top: 10px; letter-spacing: 0.3px;
}
.nav-links { margin-top: 12px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.nav-links a {
  color: #fff; text-decoration: none; font-size: 13px; font-weight: 600;
  padding: 5px 12px; border-radius: 6px; background: rgba(255,255,255,0.15);
  display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s;
}
.nav-links a:hover { background: rgba(255,255,255,0.28); }

/* ══ PANEL PRINCIPAL ══ */
#mainPanel { padding-bottom: 40px; }

.wrap { max-width: 1360px; margin: 0 auto; padding: 28px 16px 0; }

/* Barra de control */
.control-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.control-bar h2 { font-size: 17px; font-weight: 700; color: var(--primary); flex: 1; }
.tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--border); background: #f4f7f9; color: var(--text-muted);
  cursor: pointer; transition: all 0.18s; display: inline-flex; align-items: center; gap: 6px;
}
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.tab:hover:not(.active) { border-color: var(--primary-light); color: var(--primary); background: #edf4f8; }

.btn-action {
  font-family: inherit; font-size: 13px; font-weight: 700; border: none;
  border-radius: 8px; padding: 9px 16px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: filter 0.15s, transform 0.15s;
}
.btn-action:hover { filter: brightness(0.94); transform: translateY(-1px); }
.btn-print { background: var(--primary); color: #fff; }
.btn-export { background: var(--accent); color: #fff; }

/* Stats */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow-sm);
}
.stat-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 4px; }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* Filtros */
.filters {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center;
}
.filters select, .filters input {
  font-family: inherit; padding: 8px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 13px; background: #fff; color: var(--text);
  transition: border-color 0.2s;
}
.filters select:focus, .filters input:focus { outline: none; border-color: var(--border-focus); }
.filters label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

/* Tabla de resultados (estilo hoja de cálculo) */
.table-wrap {
  overflow: auto;
  max-height: min(70vh, 720px);
  border: 1px solid #c5d0d8;
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.table-wrap > table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-wrap > table > thead th {
  position: sticky; top: 0; z-index: 2;
  background: #eef2f6; color: var(--primary); font-weight: 700;
  padding: 10px 12px; text-align: left;
  border: 1px solid #d5dee6; white-space: nowrap;
}
.table-wrap > table > thead th.center { text-align: center; }
.table-wrap > table > tbody > tr > td {
  padding: 12px;
  border: 1px solid #e5e7eb;
  vertical-align: middle;
  background: #fff;
}
tbody tr.main-row:nth-child(4n+1) td { background: #fafbfc; }
tbody tr.main-row:hover td { background: #f1f7fa; }
tbody tr.main-row.open-parent td { background: #f8fafc; }
td.center { text-align: center; }

.pos-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%; font-weight: 800; font-size: 13px;
}
.pos-1 { background: #fef3c7; color: var(--gold); }
.pos-2 { background: #f1f5f9; color: var(--silver); }
.pos-3 { background: #fef3c7; color: var(--bronze); }
.pos-n { background: #f4f7f9; color: var(--text-muted); }

.score-chip {
  display: inline-block; padding: 0; border-radius: 0;
  font-weight: 700; font-size: 13.5px; background: none;
}
.score-poster { color: var(--accent); }
.score-ponencia { color: var(--accent2); }

.mod-badge {
  display: inline-block; padding: 3px 9px; border-radius: 6px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px;
}
.mod-poster   { background: #e6f4f3; color: var(--accent); }
.mod-ponencia { background: var(--accent2-light); color: var(--accent2); }

.jurado-cell { font-size: 12px; color: var(--text-muted); }
.obs-cell { font-size: 12px; color: #475569; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sección ranking destacado */
.ranking-section { margin-bottom: 24px; }
.ranking-section h3 {
  font-size: 15px; font-weight: 700; color: var(--primary);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.podium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 14px; margin-bottom: 20px; }
.podium-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.podium-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
.podium-card.gold::before   { background: #f59e0b; }
.podium-card.silver::before { background: #94a3b8; }
.podium-card.bronze::before { background: #b45309; }
.podium-pos { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.podium-card.gold   .podium-pos { color: var(--gold); }
.podium-card.silver .podium-pos { color: var(--silver); }
.podium-card.bronze .podium-pos { color: var(--bronze); }
.podium-title { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 3px; line-height: 1.3; }
.podium-meta  { font-size: 12px; color: var(--text-muted); }
.podium-score { font-size: 22px; font-weight: 800; margin-top: 8px; }
.podium-card.gold   .podium-score { color: var(--gold); }
.podium-card.silver .podium-score { color: var(--silver); }
.podium-card.bronze .podium-score { color: var(--bronze); }

/* Bloques por categoría */
.cat-block { margin-bottom: 22px; }
.cat-title {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 10px;
}
.cat-chip {
  display: inline-block; padding: 4px 11px; border-radius: 6px;
  font-size: 11.5px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
}
.cat-profesional { background: #e0f2fe; color: #075985; }
.cat-internado   { background: #fef3c7; color: #92400e; }
.cat-externado   { background: #dcfce7; color: #166534; }
.cat-posgrado    { background: var(--accent2-light); color: #5b21b6; }
.cat-sin         { background: #f1f5f9; color: var(--text-muted); }
.cat-count { font-size: 12px; font-weight: 600; color: var(--text-muted); }
/* auto-fill evita que una categoría con un solo caso ocupe todo el ancho */
.cat-block .podium-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-bottom: 0; }
.podium-pct { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }
.jurados-chip {
  display: inline-block; background: #f1f5f9; color: var(--text-muted);
  border-radius: 5px; padding: 2px 7px; font-size: 11px; font-weight: 700;
}
.score-pct { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 1px; }

/* Vacío */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state svg { width: 48px; height: 48px; margin: 0 auto 12px; display: block; opacity: 0.35; }
.empty-state p { font-size: 14px; }

/* Confirm overlay */
.confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(18,59,93,0.5); backdrop-filter: blur(4px);
  z-index: 9999; align-items: center; justify-content: center; padding: 20px;
}
.confirm-overlay.active { display: flex; }
.confirm-box {
  background: #fff; border-radius: 14px; max-width: 420px; width: 100%;
  padding: 28px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.18);
  animation: scaleIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
.confirm-box h3 { font-size: 18px; font-weight: 800; color: var(--danger); margin-bottom: 10px; }
.confirm-box p  { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 10px; justify-content: center; }
.cb-cancel  { background: #e7edf1; color: var(--text); border: none; font-family: inherit; font-weight: 700; border-radius: 9px; padding: 11px 22px; cursor: pointer; font-size: 14px; }
.cb-confirm { background: var(--danger); color: #fff; border: none; font-family: inherit; font-weight: 700; border-radius: 9px; padding: 11px 22px; cursor: pointer; font-size: 14px; }

/* Print */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; }
  header { background: none !important; color: #000 !important; border-bottom: 2px solid #123b5d; padding: 4px 0 !important; }
  header h1 { font-size: 16px; color: #123b5d; }
  .nav-links, .control-bar button, .tab-group, .filters { display: none !important; }
  .wrap { max-width: 100%; padding: 0; }
  .stats-grid { gap: 6px; }
  .stat-card { padding: 8px 10px; }
  .stat-value { font-size: 20px; }
  .table-wrap { max-height: none; overflow: visible; }
  table { font-size: 11px; }
  th, td { padding: 5px 7px; }
}

@media (max-width: 700px) {
  .control-bar { flex-direction: column; align-items: flex-start; }
  .podium-grid { grid-template-columns: 1fr; }
}
</style>

<script>
const SUPABASE_URL = 'https://qkpctbzhwexxbaqejrag.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RdXnXo-ubIdSTXGAsu9YaQ_PDMHkHn3';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ══════════════════════════════════════════════════════════════════
   ESTADO
══════════════════════════════════════════════════════════════════ */
let currentTab = 'todos';
let allRecords = [];   // una fila por evaluación individual de jurado
let allCases   = [];   // una fila por caso (evaluaciones agrupadas)

const CATEGORIAS    = ['Profesional', 'Internado', 'Externado', 'Posgrado'];
const SIN_CATEGORIA = 'Sin categoría';
const CAT_CLASS = {
  'Profesional': 'cat-profesional',
  'Internado':   'cat-internado',
  'Externado':   'cat-externado',
  'Posgrado':    'cat-posgrado'
};

/* ══════════════════════════════════════════════════════════════════
   CARGA DE DATOS
══════════════════════════════════════════════════════════════════ */
async function loadRecords() {
  const { data, error } = await supabaseClient
    .from('evaluaciones')
    .select('id, caso_id, jurado_nombre, categoria_jurado, puntaje, max_puntaje, puntajes_criterios, observaciones, fecha_evaluacion, created_at, casos(*)')
    .order('created_at', { ascending: false });
  if (error) {
    alert(`No se pudieron cargar los resultados desde Supabase: ${error.message}`);
    return;
  }
  allRecords = (data || []).map(row => ({
    ...row.casos,
    casoId:     row.caso_id,
    categoria:  (row.casos && row.casos.categoria_participante) || SIN_CATEGORIA,
    jurado:     row.jurado_nombre,
    puntaje:    Number(row.puntaje) || 0,
    maxPuntaje: Number(row.max_puntaje) || 0,
    scores:     row.puntajes_criterios,
    observaciones: row.observaciones,
    fecha:      row.fecha_evaluacion || row.created_at,
    _dbId:      row.id,
    _createdAt: row.created_at
  }));
  allCases = agruparPorCaso(allRecords);
  renderAll();
}

/* Agrupa las evaluaciones de un mismo caso. El puntaje con el que el caso
   compite es el PROMEDIO de todos los jurados que lo calificaron, de modo que
   un caso evaluado por tres jurados ocupe una sola posición en el ranking. */
function agruparPorCaso(records) {
  const map = new Map();

  records.forEach(r => {
    const key = r.casoId || `eval-${r._dbId}`;
    if (!map.has(key)) {
      map.set(key, {
        casoId:     key,
        titulo:     r.titulo,
        categoria:  r.categoria,
        area:       r.area,
        tipoCaso:   r.tipo_caso,
        modalidad:  r.modalidad,
        maxPuntaje: r.maxPuntaje,
        evaluaciones: [],
        _createdAt: r._createdAt
      });
    }
    const c = map.get(key);
    c.evaluaciones.push({ jurado: r.jurado, puntaje: r.puntaje, fecha: r.fecha });
    if (!c.maxPuntaje && r.maxPuntaje) c.maxPuntaje = r.maxPuntaje;
    if (new Date(r._createdAt) > new Date(c._createdAt)) c._createdAt = r._createdAt;
  });

  return [...map.values()].map(c => {
    if (!c.maxPuntaje) c.maxPuntaje = c.modalidad === 'Póster Científico' ? 100 : 20;
    const suma = c.evaluaciones.reduce((s, e) => s + e.puntaje, 0);
    c.nJurados  = c.evaluaciones.length;
    c.sumaTotal = suma;
    c.promedio  = suma / c.nJurados;
    c.puntaje   = Math.round(c.promedio * 10) / 10;      // puntaje oficial del caso
    c.porcentaje = c.maxPuntaje ? (c.promedio / c.maxPuntaje) * 100 : 0;
    c.jurados   = c.evaluaciones.map(e => e.jurado).filter(Boolean);
    c.fecha     = c.evaluaciones[0].fecha;
    return c;
  });
}

/* Orden oficial: mayor porcentaje del puntaje máximo. Dentro de una misma
   modalidad equivale a ordenar por puntaje, y permite comparar de forma justa
   póster (100 pts) con ponencia (20 pts) en la pestaña "Todos". */
function porPuntaje(a, b) {
  return (b.porcentaje - a.porcentaje) || (b.promedio - a.promedio);
}

/* ══════════════════════════════════════════════════════════════════
   FILTROS
══════════════════════════════════════════════════════════════════ */
function getFilteredCases() {
  let cases = [...allCases];

  if (currentTab === 'poster')   cases = cases.filter(c => c.modalidad === 'Póster Científico');
  if (currentTab === 'ponencia') cases = cases.filter(c => c.modalidad === 'Ponencia Oral');

  const cat = document.getElementById('filterCategoria')?.value;
  if (cat) cases = cases.filter(c => c.categoria === cat);

  const area = document.getElementById('filterArea')?.value;
  if (area) cases = cases.filter(c => c.area === area);

  const q = (document.getElementById('filterSearch')?.value || '').toLowerCase();
  if (q) cases = cases.filter(c => (c.titulo || '').toLowerCase().includes(q));

  const sort = document.getElementById('filterSort')?.value || 'score_desc';
  if (sort === 'score_desc') cases.sort(porPuntaje);
  if (sort === 'score_asc')  cases.sort((a, b) => porPuntaje(b, a));
  if (sort === 'date_desc')  cases.sort((a, b) => new Date(b._createdAt) - new Date(a._createdAt));
  if (sort === 'date_asc')   cases.sort((a, b) => new Date(a._createdAt) - new Date(b._createdAt));

  return cases;
}

/* ══════════════════════════════════════════════════════════════════
   RENDER PRINCIPAL
══════════════════════════════════════════════════════════════════ */
function renderAll() {
  renderStats();
  renderWinners();
  renderTable();
}

function switchTab(tab) {
  currentTab = tab;
  ['todos', 'poster', 'ponencia'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  renderAll();
}

function tabSuffix() {
  if (currentTab === 'poster')   return ' — Póster Científico';
  if (currentTab === 'ponencia') return ' — Ponencia Oral';
  return '';
}

/* ── Estadísticas ── */
function renderStats() {
  const posters   = allCases.filter(c => c.modalidad === 'Póster Científico');
  const ponencias = allCases.filter(c => c.modalidad === 'Ponencia Oral');
  const prom = arr => arr.length ? (arr.reduce((s, c) => s + c.promedio, 0) / arr.length).toFixed(1) : '—';
  const top  = arr => arr.length ? (Math.round(Math.max(...arr.map(c => c.promedio)) * 10) / 10) : '—';

  const ABREV = { 'Profesional':'Prof.', 'Internado':'Int.', 'Externado':'Ext.', 'Posgrado':'Posg.' };
  const conteoCat = CATEGORIAS
    .map(cat => `${ABREV[cat]} ${allCases.filter(c => c.categoria === cat).length}`)
    .join(' · ');

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Casos evaluados</div>
      <div class="stat-value">${allCases.length}</div>
      <div class="stat-sub">${allRecords.length} calificación(es) de jurado</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Póster — prom. / máx.</div>
      <div class="stat-value" style="color:var(--accent)">${prom(posters)}</div>
      <div class="stat-sub">Máximo registrado: ${top(posters)} / 100</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ponencia — prom. / máx.</div>
      <div class="stat-value" style="color:var(--accent2)">${prom(ponencias)}</div>
      <div class="stat-sub">Máximo registrado: ${top(ponencias)} / 20</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Casos por categoría</div>
      <div class="stat-value">${CATEGORIAS.filter(cat => allCases.some(c => c.categoria === cat)).length} / 4</div>
      <div class="stat-sub">${conteoCat}</div>
    </div>
  `;
}

/* ── Ganadores por categoría ── */
function renderWinners() {
  const cases   = getFilteredCases();
  const section = document.getElementById('winnersSection');

  if (!cases.length) { section.innerHTML = ''; return; }

  const classes = ['gold', 'silver', 'bronze'];
  const labels  = ['🥇 Ganador de la categoría', '🥈 2.º Lugar', '🥉 3.er Lugar'];
  const cats    = [...CATEGORIAS, SIN_CATEGORIA].filter(cat => cases.some(c => c.categoria === cat));

  section.innerHTML = `
    <h3>
      <svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Ganadores por categoría${tabSuffix()}
    </h3>
    ${cats.map(cat => {
      const deCat = cases.filter(c => c.categoria === cat).sort(porPuntaje);
      const podio = deCat.slice(0, 3);
      return `
        <div class="cat-block">
          <div class="cat-title">
            <span class="cat-chip ${CAT_CLASS[cat] || 'cat-sin'}">${esc(cat)}</span>
            <span class="cat-count">${deCat.length} caso${deCat.length === 1 ? '' : 's'} en competencia</span>
          </div>
          <div class="podium-grid">
            ${podio.map((c, i) => `
              <div class="podium-card ${classes[i]}">
                <div class="podium-pos">${labels[i]}</div>
                <div class="podium-title">${esc(c.titulo || 'Sin título')}</div>
                <div class="podium-meta">${esc(c.area || '—')} · ${esc(c.modalidad || '—')}</div>
                <div class="podium-score">${c.puntaje} <span style="font-size:14px;font-weight:600;opacity:0.6">/ ${c.maxPuntaje} pts</span></div>
                <div class="podium-pct">${c.porcentaje.toFixed(1)}% · promedio de ${c.nJurados} jurado${c.nJurados === 1 ? '' : 's'}</div>
              </div>
            `).join('')}
          </div>
        </div>`;
    }).join('')}
  `;
}

/* ── Tabla ── */
function renderTable() {
  const cases = getFilteredCases();
  const tbody = document.getElementById('resultsBody');

  if (!cases.length) {
    tbody.innerHTML = `
      <tr><td colspan="9">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          <p>No hay evaluaciones registradas${currentTab !== 'todos' ? ' para esta modalidad' : ''}.</p>
        </div>
      </td></tr>`;
    return;
  }

  tbody.innerHTML = cases.map((c, idx) => {
    const pos       = idx + 1;
    const posClass  = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-n';
    const posLabel  = pos <= 3 ? `${pos}.º` : `${pos}`;
    const isPoster  = c.modalidad === 'Póster Científico';
    const scoreClass= isPoster ? 'score-poster' : 'score-ponencia';
    const modClass  = isPoster ? 'mod-poster'   : 'mod-ponencia';

    return `
      <tr class="main-row">
        <td class="center" style="color:var(--text-muted);font-size:12px">${pos}</td>
        <td class="center"><span class="pos-badge ${posClass}">${posLabel}</span></td>
        <td><strong>${esc(c.titulo || 'Sin título')}</strong></td>
        <td class="center"><span class="cat-chip ${CAT_CLASS[c.categoria] || 'cat-sin'}">${esc(c.categoria)}</span></td>
        <td>${esc(c.area || '—')}</td>
        <td class="center"><span class="mod-badge ${modClass}">${esc(c.modalidad)}</span></td>
        <td class="center">
          <span class="score-chip ${scoreClass}">${c.puntaje} / ${c.maxPuntaje}</span>
          <span class="score-pct">${c.porcentaje.toFixed(1)}%</span>
        </td>
        <td class="center">
          <span class="jurados-chip" title="${esc(c.jurados.join(', '))}">${c.nJurados}</span>
        </td>
        <td style="font-size:12px;white-space:nowrap">${esc(formatFecha(c.fecha))}</td>
      </tr>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════
   EXPORTAR CSV
══════════════════════════════════════════════════════════════════ */
function exportCSV() {
  const cases = getFilteredCases();
  if (!cases.length) { alert('No hay registros para exportar.'); return; }

  const headers = ['Posicion', 'Categoria', 'Titulo del Caso', 'Servicio', 'Modalidad',
                   'Puntaje promedio', 'Puntaje maximo', 'Porcentaje', 'N jurados',
                   'Jurados', 'Suma de puntajes', 'Fecha'];

  const rows = cases.map((c, i) => [
    i + 1, c.categoria, c.titulo, c.area, c.modalidad,
    c.puntaje, c.maxPuntaje, c.porcentaje.toFixed(1) + '%', c.nJurados,
    c.jurados.join(' | '), c.sumaTotal, formatFecha(c.fecha)
  ].map(v => `"${String(v ?? '-').replace(/"/g, '""')}"`));

  const csv  = ['sep=;', [headers, ...rows].map(r => r.join(';')).join('\n')].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `Resultados_HPVC2026_${Date.now()}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

/* ══════════════════════════════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════════════════════════════ */
function esc(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatFecha(f) {
  if (!f) return '—';
  return String(f).slice(0, 10);
}

/* ══════════════════════════════════════════════════════════════════
   INICIALIZACIÓN
══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('headerNav').style.display = 'flex';
  loadRecords();
});
</script>
