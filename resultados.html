<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Resultados — I Mundial de Casos Clínicos HPVC 2026</title>
<link rel="icon" href="escudo-msp.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #123b5d;
  --primary-light: #1f6f8f;
  --accent: #0b7a75;
  --accent-light: #e6f4f3;
  --accent2: #7c3aed;
  --accent2-light: #ede9fe;
  --bg: #f4f7f9;
  --surface: #ffffff;
  --border: #d5e0e6;
  --border-focus: #1f6f8f;
  --text: #26343c;
  --text-muted: #64748b;
  --danger: #b42318;
  --success: #16794c;
  --success-bg: #eaf7f0;
  --gold: #b7791f;
  --silver: #64748b;
  --bronze: #92400e;
  --shadow-sm: 0 2px 8px rgba(18,59,93,0.06);
  --shadow-md: 0 8px 28px rgba(18,59,93,0.10);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

.icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

body { background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }

/* ══ HEADER ══ */
header {
  background: linear-gradient(135deg, rgba(18,59,93,0.95), rgba(31,111,143,0.92)), url('BACKGROUND.jpg') center/cover no-repeat;
  color: #fff; padding: 26px 20px 20px; text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.header-brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px; }
.header-brand img { width: 52px; height: 52px; border-radius: 50%; background: #fff; padding: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
header h1 { font-size: clamp(17px, 3vw, 26px); font-weight: 800; letter-spacing: -0.4px; }
header h2 { font-size: clamp(12px, 1.8vw, 15px); font-weight: 500; opacity: 0.9; margin-top: 2px; }
.public-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.18); backdrop-filter: blur(4px);
  border-radius: 20px; padding: 4px 14px; font-size: 12.5px; font-weight: 700;
  margin-top: 10px; letter-spacing: 0.3px;
}
.nav-links { margin-top: 12px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.nav-links a {
  color: #fff; text-decoration: none; font-size: 13px; font-weight: 600;
  padding: 5px 12px; border-radius: 6px; background: rgba(255,255,255,0.15);
  display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s;
}
.nav-links a:hover { background: rgba(255,255,255,0.28); }

/* ══ PANEL PRINCIPAL ══ */
#mainPanel { padding-bottom: 40px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 0; }

/* Barra de control */
.control-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.control-bar h2 { font-size: 17px; font-weight: 700; color: var(--primary); flex: 1; }
.tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--border); background: #f4f7f9; color: var(--text-muted);
  cursor: pointer; transition: all 0.18s; display: inline-flex; align-items: center; gap: 6px;
}
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.tab:hover:not(.active) { border-color: var(--primary-light); color: var(--primary); background: #edf4f8; }

.btn-action {
  font-family: inherit; font-size: 13px; font-weight: 700; border: none;
  border-radius: 8px; padding: 9px 16px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: filter 0.15s, transform 0.15s;
}
.btn-action:hover { filter: brightness(0.94); transform: translateY(-1px); }
.btn-print { background: var(--primary); color: #fff; }
.btn-export { background: var(--accent); color: #fff; }

/* Stats */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow-sm);
}
.stat-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 4px; }
.stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* Filtros */
.filters {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center;
}
.filters select, .filters input {
  font-family: inherit; padding: 8px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 13px; background: #fff; color: var(--text);
  transition: border-color 0.2s;
}
.filters select:focus, .filters input:focus { outline: none; border-color: var(--border-focus); }
.filters label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

/* Tabla de resultados */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  background: #edf4f8; color: var(--primary); font-weight: 700;
  padding: 11px 13px; text-align: left; border-bottom: 1.5px solid var(--border);
  white-space: nowrap;
}
thead th.center { text-align: center; }
tbody tr { transition: background 0.15s; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 10px 13px; border-bottom: 1px solid #eef2f5; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
td.center { text-align: center; }

.pos-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%; font-weight: 800; font-size: 13px;
}
.pos-1 { background: #fef3c7; color: var(--gold); }
.pos-2 { background: #f1f5f9; color: var(--silver); }
.pos-3 { background: #fef3c7; color: var(--bronze); }
.pos-n { background: #f4f7f9; color: var(--text-muted); }

.score-chip {
  display: inline-block; padding: 3px 10px; border-radius: 99px;
  font-weight: 700; font-size: 13px;
}
.score-poster { background: #e6f4f3; color: var(--accent); }
.score-ponencia { background: var(--accent2-light); color: var(--accent2); }

.mod-badge {
  display: inline-block; padding: 3px 9px; border-radius: 6px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px;
}
.mod-poster   { background: #e6f4f3; color: var(--accent); }
.mod-ponencia { background: var(--accent2-light); color: var(--accent2); }

.jurado-cell { font-size: 12px; color: var(--text-muted); }
.obs-cell { font-size: 12px; color: #475569; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Detalle expandible */
.detail-row td { background: #f8fafc; padding: 14px 20px; }
.detail-row { display: none; }
.detail-row.open { display: table-row; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px; }
.detail-item { font-size: 12.5px; }
.detail-item .dlabel { font-weight: 700; color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
.detail-item .dval { color: var(--text); margin-top: 2px; }
.criteria-mini { margin-top: 10px; }
.criteria-mini table { font-size: 12px; }
.criteria-mini th { font-size: 11px; padding: 5px 8px; }
.criteria-mini td { padding: 5px 8px; }

.btn-expand {
  background: none; border: none; cursor: pointer; color: var(--primary-light);
  font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 5px; transition: background 0.15s;
}
.btn-expand:hover { background: #edf4f8; }

/* Sección ranking destacado */
.ranking-section { margin-bottom: 24px; }
.ranking-section h3 {
  font-size: 15px; font-weight: 700; color: var(--primary);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.podium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 14px; margin-bottom: 20px; }
.podium-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.podium-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
.podium-card.gold::before   { background: #f59e0b; }
.podium-card.silver::before { background: #94a3b8; }
.podium-card.bronze::before { background: #b45309; }
.podium-pos { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.podium-card.gold   .podium-pos { color: var(--gold); }
.podium-card.silver .podium-pos { color: var(--silver); }
.podium-card.bronze .podium-pos { color: var(--bronze); }
.podium-title { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 3px; line-height: 1.3; }
.podium-meta  { font-size: 12px; color: var(--text-muted); }
.podium-score { font-size: 22px; font-weight: 800; margin-top: 8px; }
.podium-card.gold   .podium-score { color: var(--gold); }
.podium-card.silver .podium-score { color: var(--silver); }
.podium-card.bronze .podium-score { color: var(--bronze); }

/* Vacío */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state svg { width: 48px; height: 48px; margin: 0 auto 12px; display: block; opacity: 0.35; }
.empty-state p { font-size: 14px; }

/* Confirm overlay */
.confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(18,59,93,0.5); backdrop-filter: blur(4px);
  z-index: 9999; align-items: center; justify-content: center; padding: 20px;
}
.confirm-overlay.active { display: flex; }
.confirm-box {
  background: #fff; border-radius: 14px; max-width: 420px; width: 100%;
  padding: 28px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.18);
  animation: scaleIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
.confirm-box h3 { font-size: 18px; font-weight: 800; color: var(--danger); margin-bottom: 10px; }
.confirm-box p  { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 10px; justify-content: center; }
.cb-cancel  { background: #e7edf1; color: var(--text); border: none; font-family: inherit; font-weight: 700; border-radius: 9px; padding: 11px 22px; cursor: pointer; font-size: 14px; }
.cb-confirm { background: var(--danger); color: #fff; border: none; font-family: inherit; font-weight: 700; border-radius: 9px; padding: 11px 22px; cursor: pointer; font-size: 14px; }

/* Print */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; }
  header { background: none !important; color: #000 !important; border-bottom: 2px solid #123b5d; padding: 4px 0 !important; }
  header h1 { font-size: 16px; color: #123b5d; }
  .nav-links, .control-bar button, .tab-group, .filters, .btn-expand { display: none !important; }
  .wrap { max-width: 100%; padding: 0; }
  .stats-grid { gap: 6px; }
  .stat-card { padding: 8px 10px; }
  .stat-value { font-size: 20px; }
  table { font-size: 11px; }
  th, td { padding: 5px 7px; }
}

@media (max-width: 700px) {
  .control-bar { flex-direction: column; align-items: flex-start; }
  .podium-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
const SUPABASE_URL = 'https://qkpctbzhwexxbaqejrag.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RdXnXo-ubIdSTXGAsu9YaQ_PDMHkHn3';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
/* ══════════════════════════════════════════════════════════════════
   CRITERIOS DE REFERENCIA (para mostrar desglose de puntajes)
══════════════════════════════════════════════════════════════════ */
const CRITERIA_POSTER_NAMES = [
  "Originalidad e innovación",
  "Relevancia científica",
  "Metodología",
  "Calidad del póster",
  "Defensa y respuestas"
];
const CRITERIA_PONENCIA_NAMES = [
  "Originalidad",
  "Complejidad diagnóstica",
  "Rigor metodológico",
  "Evidencia científica",
  "Calidad de la presentación",
  "Aplicabilidad clínica",
  "Trabajo interdisciplinario"
];

/* ══════════════════════════════════════════════════════════════════
   ESTADO
══════════════════════════════════════════════════════════════════ */
let currentTab = 'todos';
let expandedRow = null;

/* ══════════════════════════════════════════════════════════════════
   DATOS
══════════════════════════════════════════════════════════════════ */
let allRecords = [];

async function loadRecords() {
  const { data, error } = await supabaseClient
    .from('evaluaciones')
    .select('id, jurado, categoria, puntaje, puntaje_maximo, criterios, observaciones, fecha_evaluacion, created_at, casos(*)')
    .order('created_at', { ascending: false });
  if (error) {
    alert(`No se pudieron cargar los resultados desde Supabase: ${error.message}`);
    return;
  }
  allRecords = (data || []).map(row => ({
    ...row.casos,
    ...(row.casos?.datos || {}),
    jurado: row.jurado,
    categoria: row.categoria,
    puntaje: row.puntaje,
    maxPuntaje: row.puntaje_maximo,
    scores: row.criterios,
    observaciones: row.observaciones,
    fecha: row.fecha_evaluacion || row.created_at,
    _dbId: row.id,
    _createdAt: row.created_at
  }));
  renderAll();
}

function getAllRecords() {
  return [...allRecords].sort((a, b) => b.puntaje - a.puntaje);
}

function getFilteredRecords() {
  let records = getAllRecords();

  // filtro pestaña
  if (currentTab === 'poster')   records = records.filter(r => r.modalidad === 'Póster Científico');
  if (currentTab === 'ponencia') records = records.filter(r => r.modalidad === 'Ponencia Oral');

  // filtro área
  const area = document.getElementById('filterArea')?.value;
  if (area) records = records.filter(r => r.area === area);

  // búsqueda texto
  const q = (document.getElementById('filterSearch')?.value || '').toLowerCase();
  if (q) records = records.filter(r =>
    (r.titulo || '').toLowerCase().includes(q) ||
    (r.expositor || '').toLowerCase().includes(q)
  );

  // orden
  const sort = document.getElementById('filterSort')?.value || 'score_desc';
  if (sort === 'score_desc') records.sort((a,b) => b.puntaje - a.puntaje);
  if (sort === 'score_asc')  records.sort((a,b) => a.puntaje - b.puntaje);
  if (sort === 'date_desc')  records.sort((a,b) => new Date(b._createdAt) - new Date(a._createdAt));
  if (sort === 'date_asc')   records.sort((a,b) => new Date(a._createdAt) - new Date(b._createdAt));

  return records;
}

/* ══════════════════════════════════════════════════════════════════
   RENDER PRINCIPAL
══════════════════════════════════════════════════════════════════ */
function renderAll() {
  renderStats();
  renderPodium();
  renderTable();
}

function switchTab(tab) {
  currentTab = tab;
  expandedRow = null;
  ['todos','poster','ponencia'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  renderAll();
}

/* ── Stats ── */
function renderStats() {
  const all      = getAllRecords();
  const posters  = all.filter(r => r.modalidad === 'Póster Científico');
  const ponencias= all.filter(r => r.modalidad === 'Ponencia Oral');
  const avgPoster  = posters.length  ? (posters.reduce((s,r)=>s+r.puntaje,0)/posters.length).toFixed(1) : '—';
  const avgPonencia= ponencias.length? (ponencias.reduce((s,r)=>s+r.puntaje,0)/ponencias.length).toFixed(1): '—';
  const topPoster  = posters.length  ? Math.max(...posters.map(r=>r.puntaje))  : '—';
  const topPonencia= ponencias.length? Math.max(...ponencias.map(r=>r.puntaje)): '—';

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total evaluaciones</div>
      <div class="stat-value">${all.length}</div>
      <div class="stat-sub">${posters.length} póster · ${ponencias.length} ponencia</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Póster — prom. / máx.</div>
      <div class="stat-value" style="color:var(--accent)">${avgPoster}</div>
      <div class="stat-sub">Máximo registrado: ${topPoster} / 100</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ponencia — prom. / máx.</div>
      <div class="stat-value" style="color:var(--accent2)">${avgPonencia}</div>
      <div class="stat-sub">Máximo registrado: ${topPonencia} / 20</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Servicios con evaluación</div>
      <div class="stat-value">${new Set(all.map(r=>r.area).filter(Boolean)).size}</div>
      <div class="stat-sub">de 5 servicios registrados</div>
    </div>
  `;
}

/* ── Podio ── */
function renderPodium() {
  const records = getFilteredRecords().slice(0, 3);
  const classes = ['gold','silver','bronze'];
  const labels  = ['🥇 1.er Lugar','🥈 2.º Lugar','🥉 3.er Lugar'];
  const section = document.getElementById('podiumSection');

  if (!records.length) { section.innerHTML = ''; return; }

  section.innerHTML = `
    <h3>
      <svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Tabla de Posiciones${currentTab!=='todos'?' — '+(currentTab==='poster'?'Póster Científico':'Ponencia Oral'):''}
    </h3>
    <div class="podium-grid">
      ${records.map((r,i) => `
        <div class="podium-card ${classes[i]}">
          <div class="podium-pos">${labels[i]}</div>
          <div class="podium-title">${esc(r.titulo || 'Sin título')}</div>
          <div class="podium-meta">${esc(r.area||'—')}</div>
          <div class="podium-score">${r.puntaje} <span style="font-size:14px;font-weight:600;opacity:0.6">/ ${r.maxPuntaje||'—'} pts</span></div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ── Tabla ── */
function renderTable() {
  renderPodium();
  const records = getFilteredRecords();
  const tbody = document.getElementById('resultsBody');

  if (!records.length) {
    tbody.innerHTML = `
      <tr><td colspan="10">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          <p>No hay evaluaciones registradas${currentTab!=='todos'?' para esta modalidad':''}.</p>
        </div>
      </td></tr>`;
    return;
  }

  let html = '';
  records.forEach((r, idx) => {
    const pos = idx + 1;
    const posClass = pos===1?'pos-1':pos===2?'pos-2':pos===3?'pos-3':'pos-n';
    const posLabel = pos<=3?`${pos}.º`:`${pos}`;
    const isPoster = r.modalidad === 'Póster Científico';
    const scoreClass = isPoster ? 'score-poster' : 'score-ponencia';
    const modClass   = isPoster ? 'mod-poster'   : 'mod-ponencia';
    const rid = `det-${r.id}`;
    const maxPts = r.maxPuntaje || (isPoster ? 100 : 20);

    html += `
      <tr>
        <td class="center" style="color:var(--text-muted);font-size:12px">${idx+1}</td>
        <td class="center"><span class="pos-badge ${posClass}">${posLabel}</span></td>
        <td><strong>${esc(r.titulo||'Sin título')}</strong></td>
        <td>${esc(r.area||'—')}</td>
        <td class="center"><span class="mod-badge ${modClass}">${esc(r.modalidad)}</span></td>
        <td class="center"><span class="score-chip ${scoreClass}">${r.puntaje} / ${maxPts}</span></td>
        <td class="jurado-cell">${esc(r.jurado||'—')}</td>
        <td style="font-size:12px;white-space:nowrap">${esc(r.fecha||'—')}</td>
        <td class="center">
          <button class="btn-expand" onclick="toggleDetail('${rid}', this)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            Ver
          </button>
        </td>
      </tr>
      <tr class="detail-row" id="${rid}">
        <td colspan="9">${buildDetail(r)}</td>
      </tr>`;
  });

  tbody.innerHTML = html;
}

function toggleDetail(rid, btn) {
  const row = document.getElementById(rid);
  const isOpen = row.classList.contains('open');
  // cerrar anterior
  document.querySelectorAll('.detail-row.open').forEach(r => r.classList.remove('open'));
  document.querySelectorAll('.btn-expand').forEach(b => {
    b.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg> Ver';
  });
  if (!isOpen) {
    row.classList.add('open');
    btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg> Cerrar';
  }
}

function buildDetail(r) {
  const isPoster = r.modalidad === 'Póster Científico';
  const critNames = isPoster ? CRITERIA_POSTER_NAMES : CRITERIA_PONENCIA_NAMES;
  const scores = r.scores || {};

  let scoresHtml = '';
  if (Object.keys(scores).length) {
    const rows = critNames.map((name, i) =>
      `<tr><td>${name}</td><td class="center" style="font-weight:700">${scores[i] !== undefined ? scores[i] : '—'}</td></tr>`
    ).join('');
    scoresHtml = `
      <div class="criteria-mini" style="margin-top:12px">
        <strong style="font-size:12px;color:var(--primary)">Desglose de puntajes por criterio:</strong>
        <div style="overflow-x:auto;margin-top:6px">
          <table style="max-width:400px">
            <thead><tr><th>Criterio</th><th class="center">Pts</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  const authorsList = (r.autores||[]).map(a => `<span style="margin-right:12px">• ${esc(a.name||'')} <em style="color:var(--text-muted)">(${esc(a.role||'')})</em></span>`).join('');

  return `
    <div class="detail-grid">
      <div class="detail-item"><div class="dlabel">Identificación</div><div class="dval">${esc(r.identificacion||'—')}</div></div>
      <div class="detail-item"><div class="dlabel">Institución</div><div class="dval">${esc(r.institucion||'—')}</div></div>
      <div class="detail-item"><div class="dlabel">Correo</div><div class="dval">${esc(r.correo||'—')}</div></div>
      <div class="detail-item"><div class="dlabel">Teléfono</div><div class="dval">${esc(r.telefono||'—')}</div></div>
      <div class="detail-item"><div class="dlabel">Categoría del Jurado</div><div class="dval">${esc(r.categoria||'—')}</div></div>
      <div class="detail-item"><div class="dlabel">Dictamen Comité</div><div class="dval">${esc(r.dictamen||'—')}</div></div>
    </div>
    ${authorsList ? `<div style="margin-top:10px;font-size:12.5px"><strong style="font-size:11px;color:var(--primary);text-transform:uppercase;letter-spacing:0.4px">Autores:</strong><br>${authorsList}</div>` : ''}
    ${scoresHtml}
    ${r.observaciones ? `<div style="margin-top:10px;font-size:12.5px"><strong style="font-size:11px;color:var(--primary);text-transform:uppercase;letter-spacing:0.4px">Observaciones:</strong><br><span style="color:#475569">${esc(r.observaciones)}</span></div>` : ''}
  `;
}

/* ══════════════════════════════════════════════════════════════════
   EXPORTAR CSV
══════════════════════════════════════════════════════════════════ */
function exportCSV() {
  const records = getFilteredRecords();
  if (!records.length) { alert('No hay registros para exportar.'); return; }

  const headers = ['Posición','Modalidad','Título','Expositor','Profesión','Servicio','Jurado','Dictamen','Puntaje','Puntaje Máximo','Fecha'];
  const rows = records.map((r, i) => [
    i+1, r.modalidad, r.titulo, r.expositor, r.profesion, r.area,
    r.jurado, r.dictamen, r.puntaje, r.maxPuntaje||(r.modalidad==='Póster Científico'?100:20), r.fecha
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`));

  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Resultados_HPVC2026_${Date.now()}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

/* ══════════════════════════════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════════════════════════════ */
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════════════════════════
   INICIALIZACIÓN
══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('headerNav').style.display = 'flex';
  loadRecords();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.detail-row.open').forEach(r => r.classList.remove('open'));
  });
});
</script>
